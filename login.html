<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison Urbana | Boutique Exclusiva</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Jost', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f9f9f9',
                            100: '#f2f2f2',
                            900: '#1a1a1a',
                        }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'reveal': 'reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        reveal: {
                            '0%': { clipPath: 'inset(0 0 100% 0)' },
                            '100%': { clipPath: 'inset(0 0 0 0)' },
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="selection:bg-brand-900 selection:text-white">

    <!-- ========================================== -->
    <!-- ETAPA 1: LOGIN EDITORIAL                   -->
    <!-- ========================================== -->
    <div id="loginView" class="h-screen w-full flex overflow-hidden">
        
        <!-- Mitad Izquierda: Imagen de Campaña -->
        <div class="hidden lg:block w-1/2 h-full relative group">
            <div class="absolute inset-0 bg-black/10 z-10 transition-opacity duration-500 group-hover:bg-black/0"></div>
            <img src="img/editorial.jpg" 
                 alt="Campaña Footwear" 
                 class="object-cover w-full h-full scale-100 group-hover:scale-105 transition-transform duration-1000 ease-out">
            <div class="absolute bottom-10 left-10 z-20 text-white animate-fade-in-up" style="animation-delay: 0.3s;">
                <p class="font-serif italic text-2xl">Colección Footwear</p>
                <p class="text-sm tracking-[0.2em] uppercase mt-2 opacity-80">Sneakers & Urban</p>
            </div>
        </div>

        <!-- Mitad Derecha: Formulario Minimalista -->
        <div class="w-full lg:w-1/2 h-full flex items-center justify-center bg-white p-8 sm:p-16 relative">
            <div class="w-full max-w-md animate-fade-in-up">
                
                <div class="mb-16 text-center lg:text-left">
                    <h1 class="font-serif text-4xl sm:text-5xl font-semibold tracking-tight text-brand-900 mb-4">Maison Urbana.</h1>
                    <p class="text-gray-500 font-light tracking-wide text-sm">Acceda a su cuenta para una experiencia de compra personalizada.</p>
                </div>

                <form id="loginForm" class="space-y-8">
                    <div class="relative">
                        <input type="email" id="email" required
                            class="input-minimal w-full text-base peer"
                            placeholder=" ">
                        <label for="email" class="absolute left-0 top-2 text-gray-400 text-sm transition-all duration-300 peer-focus:-top-4 peer-focus:text-xs peer-focus:text-brand-900 peer-valid:-top-4 peer-valid:text-xs peer-valid:text-brand-900 cursor-text">
                            Correo electrónico
                        </label>
                    </div>

                    <div class="relative">
                        <input type="password" id="password" required
                            class="input-minimal w-full text-base peer"
                            placeholder=" ">
                        <label for="password" class="absolute left-0 top-2 text-gray-400 text-sm transition-all duration-300 peer-focus:-top-4 peer-focus:text-xs peer-focus:text-brand-900 peer-valid:-top-4 peer-valid:text-xs peer-valid:text-brand-900 cursor-text">
                            Contraseña
                        </label>
                        <button type="button" class="absolute right-0 top-2 text-gray-400 hover:text-brand-900 transition-colors">
                            <i class="ph ph-eye text-xl"></i>
                        </button>
                    </div>

                    <div class="flex items-center justify-between pt-2">
                        <label class="flex items-center cursor-pointer group">
                            <div class="relative w-4 h-4 border border-gray-300 mr-3 flex items-center justify-center group-hover:border-brand-900 transition-colors">
                                <input type="checkbox" class="peer opacity-0 absolute inset-0 cursor-pointer">
                                <i class="ph-bold ph-check text-xs text-brand-900 opacity-0 peer-checked:opacity-100 transition-opacity"></i>
                            </div>
                            <span class="text-sm text-gray-500 group-hover:text-brand-900 transition-colors">Recordar mis datos</span>
                        </label>
                        <a href="#" class="text-xs text-gray-400 hover:text-brand-900 uppercase tracking-widest border-b border-transparent hover:border-brand-900 transition-all">¿Olvidó su contraseña?</a>
                    </div>

                    <button type="submit" id="submitBtn"
                        class="w-full bg-brand-900 text-white py-4 text-sm tracking-[0.2em] uppercase font-medium hover:bg-black transition-colors flex justify-center items-center h-14 mt-8">
                        <span id="btnText">Ingresar</span>
                        <div id="btnLoader" class="loader hidden-view"></div>
                    </button>
                </form>

                <div class="mt-16 text-center">
                    <p class="text-sm text-gray-500 font-light">
                        ¿No tiene una cuenta? <a href="#" class="text-brand-900 border-b border-brand-900 pb-0.5 ml-2 hover:opacity-70 transition-opacity">Crear cuenta</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- LÓGICA DE INTERACCIÓN                      -->
    <!-- ========================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- NAVEGACIÓN Y LOGIN ---
            const loginForm = document.getElementById('loginForm');
            const loginView = document.getElementById('loginView');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');

            // Simular inicio de sesión con animación
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Estado de carga
                btnText.classList.add('hidden-view');
                btnLoader.classList.remove('hidden-view');
                submitBtn.disabled = true;

                // Simular retraso de red (1.5 segundos)
                setTimeout(() => {
                    // Transición de vista
                    loginView.style.opacity = '0';
                    loginView.style.transition = 'opacity 0.5s ease';
                    
                    setTimeout(() => {
                        // Redirigir a la tienda (antes: productView se mostraba en esta misma página)
                        window.location.href = 'tienda.html';
                    }, 500);

                }, 1200);
            });
        });
    </script>
</body>
</html>
